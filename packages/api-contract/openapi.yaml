          "description": "会话状态"
        "404":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "追问不存在"
        "500":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "服务内部错误"
      "summary": "追问会话状态"
