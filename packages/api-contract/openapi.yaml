"info":
  "description": "核电子学学习工作站。契约唯一真源：本文件由 packages/api-contract 的 Zod schema 生成，请勿手改。"
  "title": "StarMap API"
  "version": "1.0.0"
"openapi": "3.1.0"
"paths":
  "/api/v1/content/stats":
    "get":
      "operationId": "getContentStats"
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentStatsResponse"
          "description": "统计结果"
        "500":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "服务内部错误"
      "summary": "内容库统计：来源、知识点、chunk、答案块、先修边"
  "/api/v1/health":
    "get":
      "operationId": "getHealth"
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/HealthResponse"
          "description": "服务正常"
      "summary": "健康检查"
  "/api/v1/nodes":
    "get":
      "operationId": "listNodes"
      "parameters":
        - "in": "query"
          "name": "limit"
          "schema":
            "maximum": 200
            "minimum": 1
            "type": "integer"
        - "in": "query"
          "name": "cursor"
          "schema":
            "type": "string"
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/NodeListResponse"
          "description": "节点列表"
        "400":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "查询参数不合法"
        "500":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "服务内部错误"
      "summary": "列出知识点节点及其掌握状态"
  "/api/v1/nodes/{microKpId}":
    "get":
      "operationId": "getNode"
      "parameters":
        - "in": "path"
          "name": "microKpId"
          "required": true
          "schema":
            "type": "string"
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/NodeDetailResponse"
          "description": "节点详情"
        "404":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "节点不存在"
        "500":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "服务内部错误"
      "summary": "单个知识点详情与可用关卡"
  "/api/v1/nodes/{microKpId}/sources":
    "get":
      "operationId": "getNodeSources"
      "parameters":
        - "in": "path"
          "name": "microKpId"
          "required": true
          "schema":
            "type": "string"
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/NodeSourcesResponse"
          "description": "来源页与切片"
        "404":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "节点不存在"
        "500":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "服务内部错误"
      "summary": "某知识点的来源页与切片（用于核对内容可追溯）"
"servers":
  - "description": "本地开发"
    "url": "http://127.0.0.1:3001"
