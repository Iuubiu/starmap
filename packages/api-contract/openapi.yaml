        "400":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "请求体不合法"
        "404":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "定级会话不存在"
        "422":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "选项下标越界或题目数据不合法"
        "500":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "服务内部错误"
      "summary": "提交一道定级题的作答"
  "/api/v1/placement/sessions/{sessionId}/result":
    "get":
      "description": "包含逐题复核表与中文说明。结果状态永远是 `provisional`：学满若干知识点后会自动重判并可升降级（票 11 验收 5）。"
      "operationId": "getPlacementResult"
      "parameters":
        - "in": "path"
          "name": "sessionId"
          "required": true
          "schema":
            "type": "string"
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/PlacementResultResponse"
          "description": "定级结果"
        "404":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "定级会话不存在"
        "409":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "定级尚未结束，还不能出结果"
        "500":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "服务内部错误"
      "summary": "定级结果（档位、置信度与逐题复核）"
  "/api/v1/profile":
    "get":
      "operationId": "getProfile"
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ProfileResponse"
          "description": "当前画像"
        "500":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "服务内部错误"
      "summary": "读取学习者画像（没填过的字段是 null）"
    "patch":
      "operationId": "updateProfile"
      "requestBody":
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/LearnerProfilePatch"
        "required": true
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ProfileResponse"
          "description": "更新后的画像"
        "400":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "请求体不合法"
        "500":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "服务内部错误"
      "summary": "按字段更新画像（只提交要改的那一个字段）"
  "/api/v1/recommendations":
    "get":
      "description": "推荐由 `@starmap/engine` 的纯函数 `recommend()` 算出，与 `GET /api/v1/graph` 在同一个请求里用同一时刻调用同一个函数，所以两处的 `recommendedIds` 必然一致。理由以结构化事实返回（不是拼好的中文句子），由前端渲染成可点、可加粗的表述。"
      "operationId": "getRecommendations"
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/RecommendationListResponse"
          "description": "今日推荐与摘要"
        "500":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "服务内部错误"
      "summary": "今日推荐（带结构化理由）与今日学习摘要"
  "/api/v1/recommendations/redirect":
    "post":
      "description": "把「谁拒绝了谁」记进 `learning_log`（`event = recommendation_redirect`）。被拒绝的节点从此不再被推荐，直到它产生晚于拒绝时刻的新作答证据 —— 因为只有状态变了，拒绝的理由才过期。"
      "operationId": "redirectRecommendation"
      "requestBody":
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/RedirectRequest"
        "required": true
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/RedirectResponse"
          "description": "改道已记录"
        "400":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "请求体不成形（缺字段、类型不对）"
        "404":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "微知识点不存在"
        "500":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "服务内部错误"
      "summary": "拒绝当前推荐并改道到另一个微知识点"
  "/api/v1/review/queue":
    "get":
      "description": "列出所有 `next_review_at <= now` 的已掌握叶节点，按到期先后排序。每项带 `overdueDays`（逾期天数，未逾期为 0）、`reviewStage`（间隔序列位置 0..4）与 `availableItemCount`（这个知识点现在能抽多少道复验题）。"
      "operationId": "getReviewQueue"
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ReviewQueueResponse"
          "description": "到期队列"
        "500":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "服务内部错误"
      "summary": "此刻到期的复验队列"
  "/api/v1/review/rounds":
    "post":
      "description": "从所有到期的知识点里各自抽 3–5 题（跨 `variant_group`、不重做原题），再把它们轮转交错成一份 3–5 题的题单：相邻两题来自不同知识点。


        题单与它会话都**当场落库**：判分发生在学习者做完之后，那时现算题单会让他看到的题与判分的题不是同一批。


        题目里不带 `answer` —— 与 `POST /attempts` 一样，判对错在服务端。`explainCorrect` / `explainWrong` 是预写反馈，答完立刻显示，不调模型。"
      "operationId": "startReviewRound"
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ReviewRoundStartResponse"
          "description": "会话与题单"
        "409":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "现在没有到期的复验，或者到期的知识点都还没有可复验的题"
        "500":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "服务内部错误"
      "summary": "开始一轮复验（返回交错后的题单）"
  "/api/v1/review/rounds/{roundId}":
    "get":
      "description": "判分之前 `round.verdict` 为 null、`outcomes` 为空数组；判分之后两者都有值。`items` 始终返回这一轮考了哪几题（含预写反馈），所以「上次复验考了什么」在刷新之后仍然看得到。"
      "operationId": "getReviewRound"
      "parameters":
        - "in": "path"
          "name": "roundId"
          "required": true
          "schema":
            "type": "string"
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ReviewRoundDetailResponse"
          "description": "复验会话"
        "404":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "复验会话不存在"
        "500":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "服务内部错误"
      "summary": "读一回复验（题单与判定结果）"
  "/api/v1/review/rounds/{roundId}/complete":
    "post":
      "description": "按知识点把这一轮的作答聚合成「过 / 没过」，然后各自推进排期：通过 +1 档、未通过 −1 档（1/3/7/21/60 天，夹在 0..4）。


        每个知识点分开判定的理由：间隔排期是每个知识点各自一条。A 记得牢、B 忘了，不能让 B 的遗忘把 A 的间隔一起退回去。


        响应里的 `mastery` 是判分后各知识点的掌握度：复验的落点就是「`current` 降了、`achieved` 没降」—— `achieved` 是历史最高后验，不出现在任何下调路径里。"
      "operationId": "completeReviewRound"
      "parameters":
        - "in": "path"
          "name": "roundId"
          "required": true
          "schema":
            "type": "string"
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ReviewCompleteResponse"
          "description": "判分结果"
        "404":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "复验会话不存在"
        "422":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "还有题目没答完（details.missingItemIds 列出缺哪几道）"
        "500":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "服务内部错误"
      "summary": "判分（按知识点聚合、推进间隔排期）"
  "/api/v1/tier":
    "get":
      "description": "没定过级时返回 `tier: \"P1\"` 与 `source: \"fallback\"`（参数回落到 P1），不是 404 —— 新用户该看到最完整的默认档界面，而不是一条错误。`source` 用来区分「真的定级到 P1」与「还没定级所以按 P1 渲染」：后者界面上不该说「你的水平是 P1」。"
      "operationId": "getTierOverview"
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/TierOverviewResponse"
          "description": "当前档位与参数"
      "summary": "当前档位与六维渲染参数"
  "/api/v1/tier/changes":
    "get":
      "description": "升降级都写进学习日志；这里读出来给学习者看「为什么给我降档了」。`items` 为空数组表示从未重评过。"
      "operationId": "getTierChanges"
      "parameters":
        - "in": "query"
          "name": "limit"
          "required": false
          "schema":
            "default": 10
            "maximum": 50
            "minimum": 1
            "type": "integer"
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/TierChangesResponse"
          "description": "档位变更历史"
      "summary": "档位变更历史（新的在前）"
  "/api/v1/tier/levels/{levelId}/plan":
    "get":
      "description": "首轮从哪一段开始、卡片怎么摊，由服务端按该关真实的 spec 算出。前端自己推导会把「第一段带题的段」这套规则再写一遍。`masteryProgress` 也一并返回：掌握判定按本档规则算，且证据来自 `app.attempts` 回放（跨关卡、跨会话），不是页面本地记录。"
      "operationId": "getTierLevelPlan"
      "parameters":
        - "in": "path"
          "name": "levelId"
          "required": true
          "schema":
            "type": "string"
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/TierLevelPlanResponse"
          "description": "关卡的首轮计划"
        "404":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "关卡不存在"
      "summary": "某一关在当前档位下的渲染计划"
  "/api/v1/tier/session-plan":
    "get":
      "description": "按当前档位的 `sessionNewKpLimit` 截断推荐列表，并回报被推迟的数量。P1 学习者拿到的 `items` 最多 2 条。"
      "operationId": "getTierSessionPlan"
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/TierSessionPlanResponse"
          "description": "本次会话的下一步"
      "summary": "本次会话的下一步（受档位的会话新知识点上限约束）"
  "/api/v1/video/clips":
    "get":
      "description": "返回挂在该知识点上的全部片段（按视频与起点排序）。每个片段带 `playUrl`（相对路径）、起止秒数、可读的切分理由、对齐证据，以及可追溯的来源字段（`sourceUrl`、`downloadedAt`、`asrModel` 等）。


        `microKpId` 不给时返回全部片段（调试/管理用）。没有片段时返回空数组。"
      "operationId": "listVideoClips"
      "parameters":
        - "description": "知识点 id，例如 `kp-wangzhiying-1989-p34-前置放大器的作用`"
          "in": "query"
          "name": "microKpId"
          "required": false
          "schema":
            "type": "string"
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/VideoClipListResponse"
          "description": "片段列表（可能为空）"
        "500":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "服务内部错误"
      "summary": "按知识点列出课程视频片段"
  "/media/clips/{clipId}":
    "get":
      "description": "返回 `video/mp4`。支持 `Range` 请求头，响应 206 与 `Content-Range`；不支持 Range 的客户端会拿到 200 与完整内容。


        片段不存在时 404；`file_path` 指向的文件已丢失时 404（不是 500 —— 那是内容部署问题，不是服务故障）。"
      "operationId": "streamVideoClip"
      "parameters":
        - "in": "path"
          "name": "clipId"
          "required": true
          "schema":
            "type": "string"
      "responses":
        "200":
          "content":
            "video/mp4":
              "schema":
                "format": "binary"
                "type": "string"
          "description": "完整视频内容"
        "206":
          "content":
            "video/mp4":
              "schema":
                "format": "binary"
                "type": "string"
          "description": "Range 片段"
        "404":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "片段或文件不存在"
        "500":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "服务内部错误"
      "summary": "流式播放一个视频片段（支持 HTTP Range）"
"servers":
  - "description": "本地开发"
    "url": "http://127.0.0.1:3001"
