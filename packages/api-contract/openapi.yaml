      "description": "一次返回全部叶节点（微知识点）与其先修边，供知识地图画布做本地布局与两跳邻域裁剪。不分页：力导向布局需要完整图，缺一半节点会让布局跳变。同时带上资源库的内容缺口（`contentGaps`）—— 缺口只在跟节点摆在一起时才有意义：它指向的是「课程表上本该有、资源库里没有」的东西，单独拉一份缺口列表反而无法告诉学习者「你现在看到的这张图的哪里断了」。"
      "operationId": "getGraph"
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/GraphResponse"
          "description": "整张图谱"
        "500":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "服务内部错误"
      "summary": "整张知识图谱：全部微知识点、先修边与掌握状态"
