  "/api/v1/mastery/board":
    "get":
      "description": "只读端点。按叶节点逐条回放作答证据（不读 `app.mastery` 的快照列，那列会衰减），再按三个维度分组计数：全库五态、`course_layers` 的 8 层、`sources` 里 27 本书。


        **同一个响应里的所有数字共享 `evaluatedAt`**（UTC 日界）。三个维度分别请求会让「知识点说已掌握 7、八层加起来是 6」这类矛盾出现在同一屏上。


        分母都随分子返回：`knowledgePoints.total`、`layers[].total`、`books[].total`。

        八层分母之和可能小于全库叶节点数——差额见 `unlayeredLeafCount`，那不是算错了。"
