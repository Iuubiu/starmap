  "description": "核电子学学习工作站。契约唯一真源：本文件由 packages/api-contract 的 Zod schema 生成，请勿手改。"
  "title": "StarMap API"
  "version": "1.0.0"
"openapi": "3.1.0"
"paths":
  "/api/v1/agent/probes":
    "post":
      "operationId": "startProbe"
      "requestBody":
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ProbeStartRequest"
        "required": true
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ProbeSessionResponse"
          "description": "新会话（尚未提问）"
        "400":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "请求参数不合法"
        "404":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "知识点不存在"
        "500":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "服务内部错误"
      "summary": "开始一次苏格拉底追问，返回新会话的初始阶梯状态"
  "/api/v1/agent/probes/metrics":
    "get":
      "operationId": "getProbeMetrics"
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ProbeMetricsResponse"
          "description": "统计"
        "500":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "description": "服务内部错误"
      "summary": "追问越界统计（按拒绝原因分类）"
  "/api/v1/agent/probes/{probeId}":
    "get":
      "operationId": "getProbeSession"
      "parameters":
        - "in": "path"
          "name": "probeId"
          "required": true
          "schema":
            "type": "string"
      "responses":
